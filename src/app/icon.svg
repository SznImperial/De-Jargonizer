<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="104" fill="#14130f"/>
  <!-- Three lines of text: the top two dense, the last one clear -->
  <g stroke="#7a756b" stroke-width="26" stroke-linecap="round">
    <line x1="112" y1="168" x2="400" y2="168"/>
    <line x1="112" y1="248" x2="352" y2="248"/>
  </g>
  <!-- The resolved line, underlined in accent -->
  <line x1="112" y1="328" x2="288" y2="328" stroke="#eab662" stroke-width="26" stroke-linecap="round"/>
  <line x1="112" y1="382" x2="288" y2="382" stroke="#eab662" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
</svg>
