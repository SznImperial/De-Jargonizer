  <!-- Sparkle top-right -->
  <g transform="translate(370, 100)">
    <path d="M0-32 L6-6 L32 0 L6 6 L0 32 L-6 6 L-32 0 L-6-6 Z" fill="#fbbf24"/>
  </g>
  <!-- Small sparkle -->
  <g transform="translate(340, 160)">
    <path d="M0-14 L3-3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3-3 Z" fill="#fbbf24" opacity="0.6"/>
  </g>
