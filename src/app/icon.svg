<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="url(#g)" stroke-width="3" opacity="0.3"/>
  <!-- Bold D letter -->
  <path d="M148 120h100c88 0 148 60 148 136s-60 136-148 136H148V120z" fill="none" stroke="url(#g)" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Inner vertical bar of D -->
